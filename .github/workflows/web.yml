name: Web (HTML5)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Installer les templates d'export
        shell: bash
        run: |
          src=/root/.local/share/godot/export_templates
          dst="$HOME/.local/share/godot/export_templates"
          ls -la "$src" || true
          mkdir -p "$dst"
          if [ ! "$src" -ef "$dst" ]; then cp -r "$src"/. "$dst"/; fi
          ls -la "$dst"
      - name: Importer le projet
        run: godot --headless --import || true
      - name: Export Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
