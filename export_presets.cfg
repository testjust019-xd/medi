html/head_include="<script>(function(){var log=[],box,btn;function mk(){if(btn||!document.body)return;box=document.createElement('pre');box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;margin:0;padding:6px;background:rgba(0,0,0,.88);color:#ffb4a8;font:11px monospace;white-space:pre-wrap;z-index:99999;display:none';btn=document.createElement('button');btn.textContent='LOG';btn.style.cssText='position:fixed;top:6px;right:6px;z-index:100000;font:13px monospace;padding:8px 12px;opacity:.75';btn.onclick=function(){box.style.display=box.style.display==='none'?'block':'none';box.scrollTop=box.scrollHeight};document.body.appendChild(box);document.body.appendChild(btn)}function add(t){log.push(t);if(log.length>80)log.shift();mk();if(box){box.textContent=log.join(String.fromCharCode(10))}}['error','warn'].forEach(function(k){var o=console[k];console[k]=function(){add(k.toUpperCase()+': '+[].slice.call(arguments).join(' '));o.apply(console,arguments)}});window.addEventListener('error',function(e){add('JS: '+e.message)});document.addEventListener('DOMContentLoaded',mk)})();</script>"
